<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0c0e12; font-family: 'IBM Plex Sans', sans-serif; color: #ecebe6; }
    a { color: #f2c14e; } a:hover { color: #ffd978; }
  </style>
</helmet>
<div style="width: 390px; height: 844px; overflow: hidden; background: #111318; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px 0 4px; flex-shrink: 0;">
    <button type="button" aria-label="Switch layout" style="width: 44px; height: 44px; border: none; background: transparent; color: #ecebe6; display: flex; align-items: center; justify-content: center;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <span style="font-family: 'Chakra Petch', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0.24em; text-transform: uppercase;">Collection</span>
    <span style="font-size: 14px; color: #a3a9b4; width: 44px; text-align: right;">28/85</span>
  </header>

  <section aria-label="Selected figure" style="position: relative; height: 290px; flex-shrink: 0; background: #16191f; overflow: hidden;">
    <div style="position: absolute; right: 18px; bottom: 0; color: #dcd8cf; display: flex;">
      <svg width="140" height="266" viewBox="0 0 100 190" fill="currentColor" role="img" aria-label="Large image of Batman, New 52"><rect x="40" y="0" width="20" height="8" rx="2"></rect><rect x="30" y="7" width="40" height="34" rx="10"></rect><rect x="41" y="40" width="18" height="6"></rect><path d="M24 46 H76 L84 110 H16 Z"></path><path d="M24 48 L8 96 L17 101 L31 62 Z"></path><path d="M76 48 L92 96 L83 101 L69 62 Z"></path><rect x="18" y="109" width="64" height="13" rx="2"></rect><rect x="18" y="121" width="30" height="67" rx="3"></rect><rect x="52" y="121" width="30" height="67" rx="3"></rect></svg>
    </div>
    <div style="position: absolute; left: 20px; bottom: 24px; display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-family: 'Chakra Petch', sans-serif; font-size: 34px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; line-height: 1;">Batman</h1>
      <span style="font-family: 'Chakra Petch', sans-serif; font-size: 13px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: #a3a9b4;">DC Comics · owns 6 of 7</span>
      <span style="font-size: 14px; color: #a3a9b4;">2015 · <a href="https://www.bricklink.com/v2/catalog/catalogitem.page?S=76034-1">Set 76034-1</a></span>
    </div>
  </section>

  <div role="group" aria-label="Variants" style="display: flex; gap: 8px; padding: 12px 16px; overflow: hidden; flex-shrink: 0;">
    <sc-for list="{{variants}}" as="v" hint-placeholder-count="7">
      <button type="button" aria-pressed="{{v.pressed}}" style="flex-shrink: 0; height: 40px; padding: 0 14px; border-radius: 20px; border: 1px solid {{v.border}}; background: {{v.bg}}; color: {{v.ink}}; display: flex; align-items: center; gap: 6px; font-family: 'Chakra Petch', sans-serif; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap;">
        {{v.label}}
        <sc-if value="{{v.locked}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#f2c14e" stroke-width="2.4" stroke-linecap="round" aria-label="Not owned" role="img"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></sc-if>
      </button>
    </sc-for>
  </div>

  <nav aria-label="Themes" style="display: flex; gap: 6px; padding: 0 16px; height: 52px; align-items: center; overflow: hidden; flex-shrink: 0; border-top: 1px solid #2c313b; border-bottom: 1px solid #2c313b;">
    <sc-for list="{{themes}}" as="th" hint-placeholder-count="12">
      <a href="#theme" aria-label="{{th.name}}" aria-current="{{th.current}}" style="flex-shrink: 0; width: 44px; height: 44px; box-sizing: border-box; border: 2px solid {{th.border}}; border-radius: 50%; color: #ecebe6; text-decoration: none; display: flex; align-items: center; justify-content: center; font-family: 'Chakra Petch', sans-serif; font-size: 12px; font-weight: 700;">{{th.short}}</a>
    </sc-for>
  </nav>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 14px 22px;">
    <sc-for list="{{tiles}}" as="t" hint-placeholder-count="6">
      <button type="button" aria-label="{{t.label}}" style="position: relative; height: 150px; padding: 0; box-sizing: border-box; border: 3px solid {{t.frame}}; border-radius: 6px; background: {{t.bg}}; transform: skewX(-8deg); overflow: hidden;">
        <span style="display: flex; width: 100%; height: 100%; align-items: flex-end; justify-content: center; transform: skewX(8deg); color: {{t.figure}};">
          <svg width="96" height="124" viewBox="10 0 80 104" fill="currentColor" aria-hidden="true"><rect x="40" y="0" width="20" height="8" rx="2"></rect><rect x="30" y="7" width="40" height="34" rx="10"></rect><rect x="41" y="40" width="18" height="6"></rect><path d="M24 46 H76 L84 110 H16 Z"></path><path d="M24 48 L8 96 L17 101 L31 62 Z"></path><path d="M76 48 L92 96 L83 101 L69 62 Z"></path></svg>
        </span>
        <sc-if value="{{t.wish}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 8px; right: 12px; transform: skewX(8deg); color: #f2c14e; display: flex;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2l2.9 6.3 6.9.7-5.2 4.6 1.5 6.8L12 17l-6.1 3.4 1.5-6.8L2.2 9l6.9-.7z"></path></svg></span></sc-if>
      </button>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var variants = [
      ['New 52', false], ['Lego Batman Movie', false], ['Wing Suit', false], ['Armored Suit', false],
      ['Space Suit', false], ['Fairy Batman', false], ['The Batman Movie', true]
    ].map(function (entry, i) {
      var selected = i === 0;
      return {
        label: entry[0],
        locked: entry[1],
        pressed: selected ? 'true' : 'false',
        bg: selected ? '#ecebe6' : 'transparent',
        ink: selected ? '#111318' : '#ecebe6',
        border: selected ? '#ecebe6' : '#3a404c'
      };
    });
    var themes = [['MV', 'Marvel'], ['DC', 'DC Comics'], ['NJ', 'Ninjago'], ['SW', 'Star Wars'], ['LR', 'Lord of the Rings'], ['HP', 'Harry Potter'], ['OP', 'One Piece'], ['MF', 'Monster Fighters'], ['MD', 'Medieval'], ['DD', 'Dungeons and Dragons'], ['CT', 'Lego City'], ['MS', 'Miscellaneous']]
      .map(function (entry, i) {
        return { short: entry[0], name: entry[1], current: i === 1 ? 'page' : 'false', border: i === 1 ? '#f2c14e' : '#4a5162' };
      });
    var tiles = 'p7,o,p2,lw,lw,lw,p2,o2,o2'.split(',').map(function (code, i) {
      var state = code.charAt(0);
      var names = { o: 'owned', p: 'some variants owned', l: 'not owned', n: 'no image' };
      return {
        frame: i === 0 ? '#f2c14e' : 'transparent',
        bg: i === 0 ? '#3a404c' : '#262a33',
        figure: state === 'l' || state === 'n' ? '#07080a' : '#dcd8cf',
        wish: code.indexOf('w') !== -1,
        label: 'Character ' + (i + 1) + ', ' + names[state]
      };
    });
    return { variants: variants, themes: themes, tiles: tiles };
  }
}
</script>
</body>
</html>
