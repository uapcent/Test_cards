<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
  <style>
    body { margin: 0; background: #0c0e12; font-family: 'IBM Plex Sans', sans-serif; color: #ffffff; }
    a { color: #f2c14e; } a:hover { color: #ffd978; }
  </style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; padding: 16px 40px 20px; display: flex; flex-direction: column; gap: 14px; background: #111111; overflow: hidden;">

  <nav aria-label="Layouts" style="display: flex; align-items: center; gap: 4px; height: 48px;">
    <a href="Classic.dc.html" aria-current="page" style="padding: 10px 14px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #ecebe6; text-decoration: none; border-bottom: 2px solid #f2c14e;">Classic</a>
    <a href="Main.dc.html" style="padding: 10px 14px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a3a9b4; text-decoration: none; border-bottom: 2px solid transparent;">Tokens</a>
    <a href="Showcase.dc.html" style="padding: 10px 14px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a3a9b4; text-decoration: none; border-bottom: 2px solid transparent;">Showcase</a>
    <a href="#rankings" style="margin-left: 12px; padding: 10px 14px; font-family: 'Chakra Petch', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #a3a9b4; text-decoration: none; border-bottom: 2px solid transparent;">Rankings</a>
  </nav>

  <h1 style="margin: 0; text-align: center; font-size: 30px; font-weight: 600;">Minifigure checklist</h1>

  <div style="display: flex; gap: 20px; font-size: 14px;">
    <label style="display: flex; align-items: center; gap: 6px;"><input type="checkbox">Wishlist only</label>
    <label style="display: flex; align-items: center; gap: 6px;"><input type="checkbox">Unlocked only</label>
  </div>

  <h2 style="margin: 4px 0 0; font-size: 22px; font-weight: 600;">Marvel</h2>
  <div style="display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 10px;">
    <sc-for list="{{marvel}}" as="c" hint-placeholder-count="22">
      <div style="position: relative; height: 150px; border-radius: 8px; overflow: hidden; background: {{c.fill}}; color: {{c.ink}}; display: flex; align-items: flex-end; justify-content: center;">
        <svg width="74" height="140" viewBox="0 0 100 190" fill="currentColor" aria-hidden="true"><rect x="40" y="0" width="20" height="8" rx="2"></rect><rect x="30" y="7" width="40" height="34" rx="10"></rect><rect x="41" y="40" width="18" height="6"></rect><path d="M24 46 H76 L84 110 H16 Z"></path><path d="M24 48 L8 96 L17 101 L31 62 Z"></path><path d="M76 48 L92 96 L83 101 L69 62 Z"></path><rect x="18" y="109" width="64" height="13" rx="2"></rect><rect x="18" y="121" width="30" height="67" rx="3"></rect><rect x="52" y="121" width="30" height="67" rx="3"></rect></svg>
        <sc-if value="{{c.unknown}}" hint-placeholder-val="{{false}}"><span style="position: absolute; top: 24px; left: 0; right: 0; text-align: center; font-size: 22px; font-weight: 700; color: #ffffff;">?</span></sc-if>
      </div>
    </sc-for>
  </div>

  <h2 style="margin: 4px 0 0; font-size: 22px; font-weight: 600;">DC Comics</h2>
  <div style="display: grid; grid-template-columns: repeat(11, minmax(0, 1fr)); gap: 10px;">
    <div style="position: relative; height: 150px; border-radius: 8px; overflow: visible; background: #f4f2ee; color: #3b3f47; display: flex; align-items: flex-end; justify-content: center; transform: scale(1.12); z-index: 2;">
      <svg width="74" height="140" viewBox="0 0 100 190" fill="currentColor" aria-hidden="true"><rect x="40" y="0" width="20" height="8" rx="2"></rect><rect x="30" y="7" width="40" height="34" rx="10"></rect><rect x="41" y="40" width="18" height="6"></rect><path d="M24 46 H76 L84 110 H16 Z"></path><path d="M24 48 L8 96 L17 101 L31 62 Z"></path><path d="M76 48 L92 96 L83 101 L69 62 Z"></path><rect x="18" y="109" width="64" height="13" rx="2"></rect><rect x="18" y="121" width="30" height="67" rx="3"></rect><rect x="52" y="121" width="30" height="67" rx="3"></rect></svg>
      <button type="button" aria-label="Card info" style="position: absolute; top: 6px; right: 6px; width: 24px; height: 24px; border-radius: 50%; border: none; background: rgba(0, 0, 0, 0.7); color: #ffffff; font-weight: 700; font-size: 13px;">i</button>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 5px; background: rgba(0, 0, 0, 0.8); text-align: center; font-size: 12px; border-radius: 0 0 8px 8px;">
        <strong style="display: block;">Batman</strong>
        <span style="display: block;">New 52</span>
      </div>
    </div>
    <sc-for list="{{dc}}" as="c" hint-placeholder-count="10">
      <div style="position: relative; height: 150px; border-radius: 8px; overflow: hidden; background: {{c.fill}}; color: {{c.ink}}; display: flex; align-items: flex-end; justify-content: center;">
        <svg width="74" height="140" viewBox="0 0 100 190" fill="currentColor" aria-hidden="true"><rect x="40" y="0" width="20" height="8" rx="2"></rect><rect x="30" y="7" width="40" height="34" rx="10"></rect><rect x="41" y="40" width="18" height="6"></rect><path d="M24 46 H76 L84 110 H16 Z"></path><path d="M24 48 L8 96 L17 101 L31 62 Z"></path><path d="M76 48 L92 96 L83 101 L69 62 Z"></path><rect x="18" y="109" width="64" height="13" rx="2"></rect><rect x="18" y="121" width="30" height="67" rx="3"></rect><rect x="52" y="121" width="30" height="67" rx="3"></rect></svg>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  // First variant of each card, from the real data: o owned, l not owned (shown in grayscale), n no image
  cards(codes) {
    return codes.split(',').map(function (code) {
      var state = code.charAt(0);
      return {
        fill: state === 'l' ? '#c9c9c9' : '#f4f2ee',
        ink: state === 'l' ? '#6b6b6b' : state === 'n' ? '#0b0c0f' : '#3b3f47',
        unknown: state === 'n'
      };
    });
  }

  renderVals() {
    return {
      marvel: this.cards('o,l,l,l,o,o,o,l,o,l,o,l,l,l,o,n,l,l,n,l,l,l'),
      dc: this.cards('o,o,l,l,l,o,o,o,l,o')
    };
  }
}
</script>
</body>
</html>
