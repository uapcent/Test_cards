# Single-figure corrections, keyed by BrickLink ID. `rarity` is one of common, rare,
# epic, legendary; `subtheme` is a sub-theme key from the figure's own theme; `icon`
# is any drawing. Use it where the rules get one wrong, the way `scale` is used for
# the odd-sized figures.
overrides:
  sw1273:
    rarity: legendary
