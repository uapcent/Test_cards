# The trading-card layer, on top of the collection. Nothing here is required:
# a figure that is not mentioned still becomes a card, with a rarity worked out
# from the rules in src/data/cardPool.js and the look of its theme.
#
# Names are matched against a character's NAME as written in the theme files, or
# against a variant's LABEL. A trailing * matches anything starting with what comes
# before it ("Clone*" covers every clone trooper), and a lone * matches everything.

# Names that fame alone lifts into the top rarities. The order does not matter.
iconic:
  # Star Wars
  - Darth Vader
  - Luke Skywalker
  - Yoda
  - Han Solo
  - Chewbacca
  - Boba Fett
  - Obi-Wan Kenobi
  - Princess Leia
  # DC
  - Batman
  - The Joker
  - Superman
  - Wonder Woman
  # Marvel
  - Spider-Man
  - Iron Man
  - Captain America
  - Thanos
  - Hulk
  # Ninjago
  - Kai
  - Lloyd
  - Sensei Wu
  # Everything else
  - Harry Potter
  - Gandalf
  - Frodo Saquet
  - Sauron
  - Luffy

# Sub-themes: a faction, a hero family, an episode, a season. Each card belongs to
# at most one, inside its own theme, and takes from it an icon, a colour and a
# background, falling back to its theme's for whatever a sub-theme leaves out.
#
#   key      how `overrides` refers to it
#   name     shown on the card
#   icon     a drawing in src/components/icons.jsx (SUBTHEME_PATHS, or any theme icon)
#   accent   the card colour
#   art      a picture in assets/theme_backgrounds/, like a theme's `art`
#   names    character names it takes
#   labels   variant labels it takes: an episode, a season, a series
#
# The FIRST matching sub-theme of a theme wins, so list the narrow ones (a faction)
# before the broad ones (an episode or a catch-all).
subthemes:
  star-wars:
    - key: empire
      name: Galactic Empire
      icon: imperial
      accent: "#4b4f58"
      names: [Darth Vader, Imperial Stormtrooper, Chancellor Palpatine]
      labels: [Stormtrooper*]
    - key: sith
      name: Sith
      icon: sith
      accent: "#7a1f1f"
      names: [Darth Maul*, Count Dooku, General Grievous]
    - key: jedi
      name: Jedi
      icon: saber
      accent: "#1f6b6b"
      names:
