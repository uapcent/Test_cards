# Themes, in the order they appear.
#
#   key     the data file, data/<key>.yaml
#   name    shown on the tabs and headings
#   icon    one of the drawings in src/components/icons.jsx
#   accent  colour washed behind the large figure on the Showcase page
#   art     optional picture for that wash: put the file in
#           assets/theme_backgrounds/ and name it here, for example
#           art: star-wars.webp
#           It is dimmed, blurred and faded out towards the left, so a wide,
#           calm picture works better than a busy one.
- key: marvel
  name: Marvel
  icon: shield
  accent: "#8e2b26"
